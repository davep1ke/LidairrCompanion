name: Build

# Only the migrated Blazor app (LidarrCompanion.Core, .Web, .Core.Tests) is built here - the
# original LidarrCompanion.csproj is a Windows-only WPF app (UseWPF) kept as an untouched
# fallback per CLAUDE.md, and doesn't build on the Linux runners this workflow uses. Building
# LidarrCompanion.sln directly would try to build that project too and fail for reasons that have
# nothing to do with the actual web app.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Web
        run: dotnet build LidarrCompanion.Web/LidarrCompanion.Web.csproj --configuration Release

      - name: Test Core
        run: dotnet test LidarrCompanion.Core.Tests/LidarrCompanion.Core.Tests.csproj --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    # Needed to push to ghcr.io using the repo's own built-in GITHUB_TOKEN - no separate secret
    # to create or rotate. contents:read is the default already implied, listed explicitly since
    # packages:write on its own would otherwise imply the (undesired) default permission set.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lidarrcompanion:ci .

      # Only push on an actual commit landing on master, never for a pull_request build (that
      # would let an unreviewed branch overwrite the "latest" image anyone pulling from this
      # registry gets).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/lidairrcompanion
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag lidarrcompanion:ci "$IMAGE:latest"
          docker tag lidarrcompanion:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
